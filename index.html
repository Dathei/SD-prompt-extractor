<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <script type="text/javascript" src="js/plugin.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: sans-serif;
            color: #e0e1e2;
            background: #1f2023;
            overflow: hidden;
        }
        .container {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
            box-sizing: border-box;
        }
        .form-group label {
            cursor: pointer;
            user-select: none;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button:hover { background: #357abd; }
        button:disabled { background: #555; cursor: not-allowed; }

        progress {
            width: 100%;
            height: 15px;
            display: none;
        }

        .log-section {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            margin-top: 10px;
        }

        .logs {
            flex: 1;
            background: #0d0d0d;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
            font-family: Consolas, monospace;
            font-size: 0.85em;
            color: #a0a0a0;
            overflow-y: auto;
            white-space: pre-wrap;
            margin: 0;
        }
    </style>
</head>

<body>
<div class="container">
    <div id="selected"><b>You have not selected any files.</b></div>

    <div class="form-group">
        <label>
            <input type="checkbox" id="chkOverwrite"> Overwrite existing annotation and LoRa tags
        </label>
    </div>
    <div class="form-group">
        <label>
            <input type="checkbox" id="chkLoras"> Add LoRas as tags
        </label>
    </div>
    <div class="form-group">
        <label>
            <input type="checkbox" id="chkStripVersion" disabled> Remove version information from LoRa tags
        </label>
    </div>

    <div>
        <button type="button" id="extractBtn" disabled>Extract selected</button>
    </div>

    <progress id="progressBar" value="0" max="100"></progress>

    <div class="log-section">
        Logs:
        <div class="logs" id="logWindow"></div>
    </div>
</div>
</body>
</html>
